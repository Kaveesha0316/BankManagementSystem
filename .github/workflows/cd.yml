
name: C++ Production Build

on:
  push:
    branches:
      - release

  workflow_dispatch:

jobs:
  production-build:
    name: Build Production Executable
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release configuration
        run: msbuild BankManagementSystem.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: BankManagementSystem-Windows
          path: '**/BankManagementSystem.exe'
          if-no-files-found: error
          retention-days: 30
